<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - UjuziChain</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>
    <nav class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(255, 255, 255, 0.05); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
        <div class="logo"><a href="index.html" style="color:white; text-decoration:none;"><strong>Ujuzi</strong>Chain</a></div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="roleBadge" style="background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px; font-size: 13px;">Applicant</span>
            <span id="walletBadge" style="background: rgba(40, 167, 69, 0.2); color: #4cd964; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-family: monospace;">0x...</span>
            <button onclick="logout()" style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Logout</button>
        </div>
    </nav>

    <div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
        <h2 id="welcomeText" style="margin-bottom: 10px;">Portal Dashboard</h2>
        <p style="color: #888; margin-bottom: 30px;">Interact directly with the UjuziChain smart contract on Ethereum Sepolia.</p>

        <!-- Verify Credential Card -->
        <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 24px; margin-bottom: 25px;">
            <h3 style="margin-top: 0;">Verify Credential</h3>
            <p style="color: #aaa; font-size: 14px;">Query the contract directly on-chain using a Credential ID.</p>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="verifyInput" placeholder="Enter bytes32 credential ID (e.g. 0x...)" style="flex: 1; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: white;">
                <button onclick="handleVerify()" class="btn-primary" style="padding: 12px 20px; cursor: pointer;">Verify</button>
            </div>
            
            <div id="verifyResult" style="margin-top: 15px; font-size: 14px; display: none; padding: 12px; border-radius: 6px;"></div>
        </div>
    </div>

    <script>
        const contractAddress = "0xA40d77d6e31F5044C7151dAd78C8bA6C3313132F";
        const contractABI = [
          "function verifyCredential(bytes32 credentialId) external view returns (bool, string, string)"
        ];

        const role = sessionStorage.getItem("userRole") || "Applicant";
        const address = sessionStorage.getItem("userAddress") || "Not Connected";

        document.getElementById("roleBadge").innerText = role;
        document.getElementById("walletBadge").innerText = address.length > 10 ? `${address.substring(0, 6)}...${address.substring(38)}` : address;
        document.getElementById("welcomeText").innerText = `${role} Dashboard`;

        async function handleVerify() {
            const credentialId = document.getElementById("verifyInput").value.trim();
            const resultDiv = document.getElementById("verifyResult");

            if (!credentialId) {
                alert("Please provide a credential ID to verify.");
                return;
            }

            try {
                resultDiv.style.display = "block";
                resultDiv.style.background = "rgba(255,255,255,0.05)";
                resultDiv.style.color = "#ffffff";
                resultDiv.innerText = "Querying Sepolia blockchain...";

                const provider = window.ethereum ? new ethers.BrowserProvider(window.ethereum) : ethers.getDefaultProvider("sepolia");
                const contract = new ethers.Contract(contractAddress, contractABI, provider);

                const [isValid, studentId, degree] = await contract.verifyCredential(credentialId);

                if (isValid) {
                    resultDiv.style.background = "rgba(40, 167, 69, 0.2)";
                    resultDiv.style.color = "#4cd964";
                    resultDiv.innerHTML = `<strong>Credential Verified Valid</strong><br>Student ID: ${studentId}<br>Degree: ${degree}`;
                } else {
                    resultDiv.style.background = "rgba(220, 53, 69, 0.2)";
                    resultDiv.style.color = "#ff6b6b";
                    resultDiv.innerText = "Credential not found or invalid on-chain.";
                }
            } catch (err) {
                resultDiv.style.display = "block";
                resultDiv.style.background = "rgba(220, 53, 69, 0.2)";
                resultDiv.style.color = "#ff6b6b";
                resultDiv.innerText = "Verification failed: " + (err.reason || err.message);
            }
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
