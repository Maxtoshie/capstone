<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UjuziChain</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html" style="color:white; text-decoration:none;"><strong>Ujuzi</strong>Chain</a></div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Welcome to UjuziChain</h2>
            <p>Select your account type to continue</p>
            
            <div class="role-selector">
                <button class="role-btn active" id="btn-applicant" onclick="setRole('Applicant')">Applicant</button>
                <button class="role-btn" id="btn-recruiter" onclick="setRole('Recruiter')">Recruiter</button>
            </div>

            <h3 id="form-title" style="margin-bottom: 20px;">Applicant Login</h3>
            
            <button id="connectWalletBtn" class="btn-primary full-width" style="margin-top: 10px;">
                Connect MetaMask
            </button>
            
            <p id="wallet-status" style="text-align: center; margin-top: 15px; font-size: 0.9em; color: #aaa;"></p>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
