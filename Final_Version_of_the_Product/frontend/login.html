<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UjuziChain - Access Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-base: #0a0b0d;
            --bg-card: rgba(18, 20, 26, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #10b981;
        }

        .light-theme {
            --bg-base: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --border-subtle: rgba(15, 23, 42, 0.1);
            --border-hover: rgba(15, 23, 42, 0.25);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent-green: #059669;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; word-wrap: break-word; }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .navbar-wrap {
            position: sticky;
            top: 14px;
            z-index: 100;
            padding: 0 20px;
            max-width: 1200px;
            width: 100%;
            margin: 14px auto 0;
        }

        .btrust-navbar {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); cursor: pointer; }
        .logo-box {
            background: var(--text-primary);
            color: var(--bg-base);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        .logo-text { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; }

        .auth-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px 50px;
            width: 100%;
        }

        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 32px 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .role-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .role-tab {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
        }

        .role-tab.active { background: var(--text-primary); color: var(--bg-base); font-weight: 600; }

        .form-title { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; margin-bottom: 6px; text-align: left; }
        .form-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.5; text-align: left; }

        .input-group { margin-bottom: 13px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 10px 13px;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
        }

        /* Terms & Privacy Box */
        .terms-box {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px;
            margin: 16px 0 10px;
            text-align: left;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .btn-action {
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-base);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn-action:disabled { opacity: 0.45; cursor: not-allowed; }

        .toggle-mode { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted); }
        .toggle-mode a { color: var(--text-primary); text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar-wrap">
        <nav class="btrust-navbar">
            <a href="index.html" class="nav-brand">
                <div class="logo-box">UC</div>
                <div class="logo-text">UjuziChain</div>
            </a>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button onclick="toggleTheme()" id="themeBtn" style="background: transparent; border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;">☀️ Light</button>
                <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 13px;">&larr; Home</a>
            </div>
        </nav>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="role-switch">
                <button class="role-tab active" id="tabApplicant" onclick="setRole('Applicant')">Applicant</button>
                <button class="role-tab" id="tabRecruiter" onclick="setRole('Recruiter')">Recruiter</button>
            </div>

            <h2 class="form-title" id="formHeader">Applicant Sign In</h2>
            <p class="form-sub" id="formSub">Connect your MetaMask wallet to verify your identity on Ethereum Sepolia.</p>

            <div id="signUpFields" style="display: none;">
                <div class="input-group">
                    <label id="lblName">Full Name</label>
                    <input type="text" id="regFullName" class="form-input" placeholder="e.g. Maxwel Okoth">
                </div>
                <div class="input-group">
                    <label id="lblTitle">Professional Title</label>
                    <input type="text" id="regTitle" class="form-input" placeholder="e.g. Full Stack Web3 Developer">
                </div>
                <div class="input-group">
                    <label>East Africa Regional Hub</label>
                    <select id="regLocation" class="form-input" style="background: var(--bg-card); color: var(--text-primary);">
                        <option value="Nairobi, Kenya">Nairobi, Kenya</option>
                        <option value="Kigali, Rwanda">Kigali, Rwanda</option>
                        <option value="Kampala, Uganda">Kampala, Uganda</option>
                        <option value="Dar es Salaam, Tanzania">Dar es Salaam, Tanzania</option>
                    </select>
                </div>
            </div>

            <!-- Terms and Conditions & Privacy Note -->
            <div class="terms-box">
                <input type="checkbox" id="termsCheck" onchange="toggleAuthBtnState()" style="margin-top: 2px; cursor: pointer;">
                <label for="termsCheck" style="cursor: pointer; line-height: 1.4;">
                    I agree to the <b>Terms of Service</b> and acknowledge the <b>Decentralized Privacy Policy</b>. UjuziChain utilizes cryptographic hashes with zero centralized PII storage in compliance with the Kenya Data Protection Act & GDPR.
                </label>
            </div>

            <button class="btn-action" id="authSubmitBtn" onclick="executeAuth()" disabled>
                Sign In with MetaMask <span>&rarr;</span>
            </button>

            <p id="statusText" style="display: none; margin-top: 12px; font-size: 12.5px;"></p>

            <p class="toggle-mode" id="toggleModeContainer">
                Don't have an account? <a onclick="toggleAuthMode()">Create one</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        function toggleAuthBtnState() {
            const check = document.getElementById('termsCheck');
            document.getElementById('authSubmitBtn').disabled = !check.checked;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            document.getElementById('themeBtn').innerText = isLight ? '🌙 Dark' : '☀️ Light';
            localStorage.setItem('ujuzi_theme', isLight ? 'light' : 'dark');
        }

        if (localStorage.getItem('ujuzi_theme') === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('themeBtn').innerText = '🌙 Dark';
        }
    </script>
</body>
</html>
