<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UjuziChain - Access Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-base: #0a0b0d;
            --bg-card: rgba(18, 20, 26, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 80% 15%, rgba(255, 255, 255, 0.035) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='1200' height='800' viewBox='0 0 1200 800' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M-100,200 C300,100 600,400 1300,150 M-100,260 C300,160 600,460 1300,210 M-100,320 C300,220 600,520 1300,270 M-100,380 C300,280 600,580 1300,330 M-100,440 C300,340 600,640 1300,390 M-100,500 C300,400 600,700 1300,450 M-100,560 C300,460 600,760 1300,510' stroke='rgba(255,255,255,0.035)' fill='none' stroke-width='1.5'/%3E%3C/svg%3E");
            background-size: cover;
        }

        .navbar-wrap {
            position: sticky;
            top: 16px;
            z-index: 100;
            padding: 0 24px;
            max-width: 1200px;
            width: 100%;
            margin: 16px auto 0;
        }
        .btrust-navbar {
            background: rgba(18, 20, 26, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
        }
        .logo-box {
            background: #ffffff;
            color: #000000;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-item:hover { color: #ffffff; }

        .btn-nav-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-nav-back:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 24px 60px;
            width: 100%;
        }

        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            width: 100%;
            max-width: 460px;
            padding: 34px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-header {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
        }

        .role-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 22px;
            gap: 4px;
        }
        .role-tab {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .role-tab.active {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
        }

        .form-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: left;
        }
        .form-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
            line-height: 1.5;
            text-align: left;
        }

        .input-group {
            margin-bottom: 13px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 10px 13px;
            font-size: 13px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: rgba(255, 255, 255, 0.3); }

        .btn-action {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
        }

        .toggle-mode {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .toggle-mode a {
            color: #ffffff;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
        }

        .back-home-link {
            display: inline-block;
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-home-link:hover { color: #ffffff; }

        #statusText {
            margin-top: 12px;
            font-size: 12.5px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="navbar-wrap">
        <nav class="btrust-navbar">
            <a href="index.html" class="nav-brand" title="Go to UjuziChain Homepage">
                <div class="logo-box">UC</div>
                <div class="logo-text">UjuziChain</div>
            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-item">Home</a>
                <a href="index.html#about" class="nav-item">About Us</a>
            </div>

            <a href="index.html" class="btn-nav-back">
                &larr; Back to Home
            </a>
        </nav>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <a href="index.html" class="brand-header" title="Go to UjuziChain Homepage">
                <div class="logo-box">UC</div>
                <div class="logo-text">UjuziChain</div>
            </a>

            <div class="role-switch">
                <button class="role-tab active" id="tabApplicant" onclick="setRole('Applicant')">Applicant</button>
                <button class="role-tab" id="tabRecruiter" onclick="setRole('Recruiter')">Recruiter</button>
            </div>

            <h2 class="form-title" id="formHeader">Applicant Sign In</h2>
            <p class="form-sub" id="formSub">Connect your MetaMask wallet to verify your identity on Ethereum Sepolia.</p>

            <div id="signUpFields" style="display: none;">
                <div class="input-group">
                    <label id="lblName">Full Name</label>
                    <input type="text" id="regFullName" class="form-input" placeholder="e.g. Maxwel Okoth">
                </div>

                <div class="input-group">
                    <label id="lblTitle">Professional Title</label>
                    <input type="text" id="regTitle" class="form-input" placeholder="e.g. Full Stack Web3 Developer">
                </div>

                <!-- Skills Field -->
                <div class="input-group" id="groupSkills">
                    <label id="lblSkills">Technical Skills (comma-separated)</label>
                    <input type="text" id="regSkills" class="form-input" placeholder="e.g. JavaScript, Git, REST APIs, Solidity, SQL">
                </div>

                <div class="input-group">
                    <label>East Africa Regional Hub</label>
                    <select id="regLocation" class="form-input" style="background: #111318;">
                        <option value="Nairobi, Kenya">Nairobi, Kenya</option>
                        <option value="Kigali, Rwanda">Kigali, Rwanda</option>
                        <option value="Kampala, Uganda">Kampala, Uganda</option>
                        <option value="Dar es Salaam, Tanzania">Dar es Salaam, Tanzania</option>
                        <option value="Remote (East Africa)">Remote (East Africa)</option>
                    </select>
                </div>

                <!-- Document Upload Field -->
                <div class="input-group" id="groupDoc">
                    <label id="lblDoc">Upload Initial Document (CV, Certificate, PDF)</label>
                    <input type="file" id="regDocFile" class="form-input" style="padding: 7px 10px; cursor: pointer;">
                </div>
            </div>

            <button class="btn-action" id="authSubmitBtn" onclick="executeAuth()">
                Sign In with MetaMask <span>&rarr;</span>
            </button>

            <p id="statusText"></p>

            <p class="toggle-mode" id="toggleModeContainer">
                Don't have an account? <a onclick="toggleAuthMode()">Create one</a>
            </p>

            <a href="index.html" class="back-home-link">
                &larr; Return to Home
            </a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
